# Scenario D, contrib arm 2: probabilistic_sampler has no per-service scope,
# so the fraction it keeps is taken out of the business traffic too.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:34317
        max_recv_msg_size_mib: 32

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  probabilistic_sampler:
    sampling_percentage: 15
  batch:
    timeout: 1s
    send_batch_size: 2048

exporters:
  otlp:
    endpoint: 127.0.0.1:34417
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 8
      queue_size: 20000

service:
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 38888
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, probabilistic_sampler, batch]
      exporters: [otlp]
