receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:7317

processors:
  ratelimit:
    limit_type: service_name
    requests_per_second: 20
    drop_on_limit: true
    preserve_errors: false
    specific_limits:
      premium-svc:
        requests_per_second: 200
      legacy-svc:
        requests_per_second: 5
    # Stateful: all collector replicas share one view of the bucket via
    # Redis. Point this at your production Redis when running behind an
    # L4 load balancer (F5, GCLB, etc.) — otherwise N replicas × rps is
    # the real throughput, not the configured rps.
    storage:
      backend: redis
      redis:
        addr: localhost:6379
        key_prefix: otelcol:ratelimit
        timeout: 100ms
        on_error: open         # Fail open if Redis is unreachable.
        negative_cache_ttl: 0s # Disabled; set e.g. 50ms under attack.

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 9888
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [ratelimit]
      exporters: [debug]
