# Exercised by TestLoadConfig. Every field here must round-trip through
# confmap, so a broken mapstructure tag fails the build rather than silently
# ignoring an operator's setting.
statefulfilter:
  refresh_interval: 15s
  full_resync_every: 40
  wait_for_initial_load: true
  initial_load_timeout: 7s
  max_rules: 2000
  fail_closed_on_empty: true
  redis:
    addr: "127.0.0.1:6379"
    db: 2
    key_prefix: "otelcol:filter:test"
    timeout: 300ms
