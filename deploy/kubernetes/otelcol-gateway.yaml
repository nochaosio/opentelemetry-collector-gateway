# Reference Kubernetes deployment for otelcol-gateway.
#
# Sizing notes:
#   - resources.limits.memory, GOMEMLIMIT and the memory_limiter processor work
#     together: GOMEMLIMIT (~90% of the container limit) makes the Go runtime
#     GC before the kernel OOM-kills the pod, and memory_limiter applies
#     back-pressure before GOMEMLIMIT is reached.
#   - With the default in-memory rate-limit storage each replica enforces its
#     own budget (total = limit × replicas). Use the Redis storage backend for
#     a fleet-wide budget behind a load balancer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-gateway-config
  labels:
    app.kubernetes.io/name: otelcol-gateway
data:
  # Replace with your tuned config (see config/otelcol-gateway.yaml in the
  # repo for the annotated reference).
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      ratelimit:
        limit_type: service_name
        requests_per_second: 100
        drop_on_limit: true
      batch:
        timeout: 10s
        send_batch_size: 1024
    exporters:
      otlp/backend:
        endpoint: backend-collector:4317
        tls:
          insecure: true
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, ratelimit, batch]
          exporters: [otlp/backend]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, ratelimit, batch]
          exporters: [otlp/backend]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, ratelimit, batch]
          exporters: [otlp/backend]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol-gateway
  labels:
    app.kubernetes.io/name: otelcol-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: otelcol-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otelcol-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otelcol-gateway
          image: otelcol-gateway:0.1.0 # replace with your registry
          args: ["--config", "/etc/otelcol-gateway/config.yaml"]
          env:
            # ~90% of the memory limit: the GC backstop before the OOM killer.
            - name: GOMEMLIMIT
              value: "1800MiB"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
            - name: metrics
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-gateway
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otelcol-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: otelcol-gateway
  labels:
    app.kubernetes.io/name: otelcol-gateway
spec:
  selector:
    app.kubernetes.io/name: otelcol-gateway
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
