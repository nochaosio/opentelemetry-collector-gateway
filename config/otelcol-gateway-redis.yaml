extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  ratelimit:
    limit_type: service_name
    requests_per_second: 10
    drop_on_limit: true
    # permanent = o cliente descarta em vez de re-tentar, o que torna o teste
    # deterministico.
    rejection_mode: permanent
    metrics_key_allowlist: [svc-a, svc-b, svc-c]
    # Redis e o que faz as replicas dividirem o mesmo balde de tokens em vez de
    # cada uma aplicar o limite sozinha.
    storage:
      backend: redis
      redis:
        addr: redis:6379
        key_prefix: otelcol:ratelimit
        timeout: 100ms
        on_error: open

  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, ratelimit, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, ratelimit, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, ratelimit, batch]
      exporters: [debug]
