# Gateway com regras de descarte compartilhadas no Redis: o `filter` do contrib
# guarda as expressoes no proprio arquivo, entao calar um servico que comecou a
# inundar a pipeline exige editar config e rolar todos os coletores. Aqui uma
# escrita no Redis basta e as replicas convergem dentro do refresh_interval.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  statefulfilter:
    redis:
      addr: localhost:6379
      key_prefix: otelcol:filter
    refresh_interval: 10s
    # Releitura completa a cada 6 ciclos, para convergir tambem quando a regra e
    # escrita na mao (HSET sem INCR na chave de versao).
    full_resync_every: 6
    # Sem isto, um restart aceitaria trafego no estado "nenhuma regra".
    wait_for_initial_load: true
    initial_load_timeout: 5s

  ratelimit:
    limit_type: service_name
    requests_per_second: 1000
    drop_on_limit: true
    storage:
      backend: redis
      redis:
        addr: localhost:6379
        key_prefix: otelcol:ratelimit

  batch:
    send_batch_size: 8192
    timeout: 5s

exporters:
  debug:
    verbosity: normal

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      # statefulfilter antes do ratelimit: o que vai ser descartado nao deve
      # gastar orcamento de limite que o trafego legitimo precisa.
      processors: [memory_limiter, statefulfilter, ratelimit, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, statefulfilter, ratelimit, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, statefulfilter, ratelimit, batch]
      exporters: [debug]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
