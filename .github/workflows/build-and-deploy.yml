name: build-and-deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      registry: ${{ steps.v.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
      # Image tags are immutable once published, so they must never be reused.
      # github.run_number cannot carry that guarantee: it restarts at 1 whenever
      # the repository is recreated, which would make a new :2 overwrite an old
      # :2 pointing at a different binary. Date plus commit SHA is unique for
      # every build and sorts chronologically; a v* tag publishes under its own
      # name instead.
      - id: v
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: otelcol-gateway
            context: .
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
          tags: |
            ${{ needs.version.outputs.registry }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.registry }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment lives in the private environment repository, not here. This job
  # only announces that a new image exists; whoever consumes the event decides
  # what to roll out. Keeping the rollout steps in a public repo would publish
  # the layout of that infrastructure for no benefit.
  notify:
    needs: [version, build]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      # The downstream repository name is configuration, not source, so it does
      # not appear in a public workflow file.
      DISPATCH_REPO: ${{ vars.DISPATCH_REPO }}
    steps:
      - name: Dispatch image-published event
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          REGISTRY: ${{ needs.version.outputs.registry }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ] || [ -z "$DISPATCH_REPO" ]; then
            echo "::notice::DISPATCH_TOKEN or DISPATCH_REPO is not set; skipping the downstream dispatch"
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DISPATCH_REPO}/dispatches" \
            -d "$(jq -n --arg v "$VERSION" --arg r "$REGISTRY" \
                  '{event_type:"otelcol-gateway-image-published", client_payload:{version:$v, registry:$r}}')"
