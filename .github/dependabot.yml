version: 2
updates:
  # Root Go module (generated collector code).
  - package-ecosystem: gomod
    directory: "/cmd/otelcol-gateway"
    schedule:
      interval: monthly
    commit-message:
      prefix: "[chore]"
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
          - "github.com/open-telemetry/*"
      grpc-stack:
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/genproto*"
          - "google.golang.org/protobuf"
      everything-else:
        patterns:
          - "*"
    ignore:
      # grpc v1.84.x is affected by GO-2026-6443 (server panic on a missing
      # :authority/Host); v1.83.2 and v1.85.0+ are the fixed releases. Drop this
      # once v1.85.0 ships (see the grpc replace in builder-config.yaml).
      - dependency-name: "google.golang.org/grpc"
        versions: [">= 1.84.0, < 1.85.0"]
    open-pull-requests-limit: 10

  # Native processor (separate Go module).
  - package-ecosystem: gomod
    directory: "/processor/ratelimitprocessor"
    schedule:
      interval: monthly
    commit-message:
      prefix: "[chore]"
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      redis-stack:
        patterns:
          - "github.com/redis/*"
          - "github.com/alicebob/*"
      everything-else:
        patterns:
          - "*"
    ignore:
      # grpc v1.84.x is affected by GO-2026-6443 (server panic on a missing
      # :authority/Host); v1.83.2 and v1.85.0+ are the fixed releases. Drop this
      # once v1.85.0 ships (see the grpc replace in builder-config.yaml).
      - dependency-name: "google.golang.org/grpc"
        versions: [">= 1.84.0, < 1.85.0"]
    open-pull-requests-limit: 10

  # Native processor (separate Go module).
  - package-ecosystem: gomod
    directory: "/processor/statefulfilterprocessor"
    schedule:
      interval: monthly
    commit-message:
      prefix: "[chore]"
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      redis-stack:
        patterns:
          - "github.com/redis/*"
          - "github.com/alicebob/*"
      everything-else:
        patterns:
          - "*"
    ignore:
      # grpc v1.84.x is affected by GO-2026-6443 (server panic on a missing
      # :authority/Host); v1.83.2 and v1.85.0+ are the fixed releases. Drop this
      # once v1.85.0 ships (see the grpc replace in builder-config.yaml).
      - dependency-name: "google.golang.org/grpc"
        versions: [">= 1.84.0, < 1.85.0"]
    open-pull-requests-limit: 10

  # GitHub Actions we pin by version in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "[chore]"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
