# statefulfilter processor playground.
#
# The drop rules are NOT in this file: they live in Redis and are picked up by
# every replica within refresh_interval, with no restart. See README.md.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  statefulfilter:
    redis:
      addr: redis:6379
      key_prefix: otelcol:filter
    # Short on purpose: a new rule reaches the collector in <= 3s here,
    # instead of the 10s default.
    refresh_interval: 3s
    # Full HGETALL every other poll, so a rule written without bumping the
    # version counter still converges.
    full_resync_every: 2
    wait_for_initial_load: true
    initial_load_timeout: 5s
    max_rules: 500
    fail_closed_on_empty: false

exporters:
  # Prints one line per exported batch with the item counts that survived.
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [statefulfilter]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [statefulfilter]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [statefulfilter]
      exporters: [debug]
